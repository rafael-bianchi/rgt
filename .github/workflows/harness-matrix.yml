name: Agent Harness Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  harness-verification:
    name: Agent Harnesses & Provenance Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq sqlite3

      - name: Install NPM agent harnesses
        run: |
          sudo npm install -g --no-fund --no-audit \
            @anthropic-ai/claude-code \
            opencode-ai \
            @openai/codex \
            @earendil-works/pi-coding-agent \
            @kilocode/cli \
            @github/copilot \
            @google/gemini-cli

      - name: Install Python agent harnesses in isolated venvs
        run: |
          sudo mkdir -p /opt/harnesses
          
          # Mistral Vibe
          sudo python3 -m venv /opt/harnesses/vibe
          sudo /opt/harnesses/vibe/bin/pip install --no-cache-dir mistral-vibe
          sudo ln -sf /opt/harnesses/vibe/bin/vibe /usr/local/bin/vibe
          
          # Hermes Agent
          sudo python3 -m venv /opt/harnesses/hermes
          sudo /opt/harnesses/hermes/bin/pip install --no-cache-dir hermes-agent
          sudo ln -sf /opt/harnesses/hermes/bin/hermes /usr/local/bin/hermes

      - name: Build RGT binary
        run: |
          cargo build --release --locked --bin rgt
          echo "RGT_BIN=$PWD/target/release/rgt" >> $GITHUB_ENV

      - name: Run comprehensive harness & provenance test suite
        run: |
          chmod +x ./scripts/test-harnesses-e2e.sh
          ./scripts/test-harnesses-e2e.sh | tee test-output.log

      - name: Publish Test Summary to GitHub Actions
        if: always()
        run: |
          echo "## 🛡️ RGT Agent Harnesses & Provenance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "Verification PASSED successfully" test-output.log; then
            echo "✅ **All agent harness tests, doctor checks, hook captures, and provenance derivations passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **One or more harness or provenance checks failed.** Review the log below." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 40 test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
