name: Turtle export performance

on:
  push:
    branches:
      - feat/prov-o-turtle-export-pr
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turtle-export:
    name: Turtle probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Record runner details
        shell: bash
        run: |
          {
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH / $ImageOS $ImageVersion"
            rustc --version --verbose
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              lscpu
              free -h
              cat /etc/os-release
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              sysctl -n machdep.cpu.brand_string
              sysctl -n hw.memsize
              sw_vers
            else
              systeminfo
            fi
          } | tee turtle-runner.txt

      - name: Build release binary
        run: cargo build --release --locked

      - name: Set benchmark binary path
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          echo "RGT_BENCH_BIN=$GITHUB_WORKSPACE/target/release/rgt$suffix" >> "$GITHUB_ENV"

      - name: Probe blocked stdout pipe
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --test test_turtle_performance blocked_stdout_pipe -- --ignored --exact --nocapture 2>&1 | tee turtle-blocked-pipe.txt

      - name: Probe latency and quota boundaries on pinned Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --test test_turtle_performance release_latency_boundaries -- --ignored --exact --nocapture 2>&1 | tee turtle-latency-boundaries.txt

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turtle-performance-${{ matrix.os }}
          path: turtle-*.txt
