name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: tar.gz
            use-cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (ARM64 Linux only)
        if: matrix.use-cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        if: matrix.use-cross != true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use-cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.suffix == 'tar.gz'
        run: strip target/${{ matrix.target }}/release/rgt

      - name: Package archive (tar.gz)
        if: matrix.suffix == 'tar.gz'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rgt dist/
          tar -czf "rgt-v${VERSION}-${{ matrix.target }}.tar.gz" -C dist rgt
          sha256sum "rgt-v${VERSION}-${{ matrix.target }}.tar.gz" > "rgt-v${VERSION}-${{ matrix.target }}.tar.gz.sha256"
        shell: bash

      - name: Package archive (zip)
        if: matrix.suffix == 'zip'
        run: |
          $tag = '${{ github.ref }}' -replace 'refs/tags/', ''
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rgt.exe" "dist/rgt.exe"
          Compress-Archive -Path dist/rgt.exe -DestinationPath "rgt-v${version}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "rgt-v${version}-${{ matrix.target }}.zip").Hash.ToLower()
          "$hash  rgt-v${version}-${{ matrix.target }}.zip" | Out-File -Encoding ascii "rgt-v${version}-${{ matrix.target }}.zip.sha256"
        shell: pwsh

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            rgt-v*.${{ matrix.suffix }}
            rgt-v*.${{ matrix.suffix }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cat rgt-*.sha256 | sort > checksums.txt
          rm -f rgt-*.sha256
        shell: bash
        working-directory: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## RGT ${{ github.ref_name }}

            ### Installation

            **Shell (macOS/Linux):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/rafael-bianchi/rgt/main/install.sh | sh
            ```

            **Homebrew:**
            ```sh
            brew install rafael-bianchi/tap/rgt
            ```

            **Cargo:**
            ```sh
            cargo install rgt
            ```

            ### Checksums
            See `checksums.txt` for SHA-256 hashes of all release archives.
          files: artifacts/*
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Dispatch Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: rafael-bianchi/homebrew-tap
          event-type: rgt-release
          client-payload: |
            {
              "version": "${{ github.ref_name }}",
              "tag": "${{ github.ref_name }}"
            }
