name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: tar.gz
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.suffix == 'tar.gz'
        run: |
          if [ "${{ matrix.cross || '' }}" = "true" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/rgt
          else
            strip target/${{ matrix.target }}/release/rgt
          fi

      - name: Package archive (tar.gz)
        if: matrix.suffix == 'tar.gz'
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          cd target/${{ matrix.target }}/release
          tar -czf "../../../rgt-v${VERSION}-${{ matrix.target }}.tar.gz" rgt
          cd ../../..
          sha256sum "rgt-v${VERSION}-${{ matrix.target }}.tar.gz" > "rgt-v${VERSION}-${{ matrix.target }}.tar.gz.sha256"
        shell: bash

      - name: Package archive (zip)
        if: matrix.suffix == 'zip'
        run: |
          $tag = '${{ inputs.tag }}' -replace 'refs/tags/', ''
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rgt.exe" "dist/rgt.exe"
          Compress-Archive -Path dist/rgt.exe -DestinationPath "rgt-v${version}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "rgt-v${version}-${{ matrix.target }}.zip").Hash.ToLower()
          "$hash  rgt-v${version}-${{ matrix.target }}.zip" | Out-File -Encoding ascii "rgt-v${version}-${{ matrix.target }}.zip.sha256"
        shell: pwsh

      - name: Attest release artifact
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: 'rgt-v*.${{ matrix.suffix }}'

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rgt-${{ matrix.target }}
          path: |
            rgt-v*.${{ matrix.suffix }}
            rgt-v*.${{ matrix.suffix }}.sha256
          if-no-files-found: error

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binary
        run: cargo build --release

      - name: Build DEB
        run: cargo deb

      - name: Upload DEB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rgt-deb
          path: target/debian/*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install dependencies
        run: dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rgt-rpm
          path: target/generate-rpm/*.rpm

  release:
    name: Create GitHub Release
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}

  homebrew:
    name: Update Homebrew formula
    needs: release
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name || 'develop' }}

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compute SHA256 for aarch64-apple-darwin
        id: sha256_aarch64_darwin
        run: |
          URL="https://github.com/rafael-bianchi/rgt/releases/download/${{ steps.version.outputs.tag }}/rgt-${{ steps.version.outputs.tag }}-aarch64-apple-darwin.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 "$URL" -o /tmp/rgt-aarch64-darwin.tar.gz
          SHA=$(sha256sum /tmp/rgt-aarch64-darwin.tar.gz | cut -d' ' -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Compute SHA256 for x86_64-unknown-linux-musl
        id: sha256_x86_64_linux
        run: |
          URL="https://github.com/rafael-bianchi/rgt/releases/download/${{ steps.version.outputs.tag }}/rgt-${{ steps.version.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 "$URL" -o /tmp/rgt-x86_64-linux.tar.gz
          SHA=$(sha256sum /tmp/rgt-x86_64-linux.tar.gz | cut -d' ' -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Compute SHA256 for aarch64-unknown-linux-gnu
        id: sha256_aarch64_linux
        run: |
          URL="https://github.com/rafael-bianchi/rgt/releases/download/${{ steps.version.outputs.tag }}/rgt-${{ steps.version.outputs.tag }}-aarch64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 "$URL" -o /tmp/rgt-aarch64-linux.tar.gz
          SHA=$(sha256sum /tmp/rgt-aarch64-linux.tar.gz | cut -d' ' -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Update Formula/rgt.rb with SHA256 values
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          SHA_DARWIN: ${{ steps.sha256_aarch64_darwin.outputs.sha }}
          SHA_LINUX_INTEL: ${{ steps.sha256_x86_64_linux.outputs.sha }}
          SHA_LINUX_ARM: ${{ steps.sha256_aarch64_linux.outputs.sha }}
        run: |
          python3 - << 'EOF'
          import os, re

          with open("Formula/rgt.rb", "r") as f:
              content = f.read()

          v = os.environ["NEW_VERSION"]
          sha_mac = os.environ["SHA_DARWIN"]
          sha_intel = os.environ["SHA_LINUX_INTEL"]
          sha_arm = os.environ["SHA_LINUX_ARM"]

          assert v and sha_mac and sha_intel and sha_arm, "Missing version or SHA values"

          content = re.sub(r'version "[^"]+"', f'version "{v}"', content, count=1)
          content = re.sub(r'(Hardware::CPU\.arm\?\s*\n\s*url [^\n]+\n\s*sha256 ")[^"]+(")', rf'\g<1>{sha_mac}\g<2>', content, count=1)
          content = re.sub(r'(Hardware::CPU\.intel\?\s*\n\s*url [^\n]+\n\s*sha256 ")[^"]+(")', rf'\g<1>{sha_intel}\g<2>', content, count=1)
          content = re.sub(r'(elsif Hardware::CPU\.arm\?\s*\n\s*url [^\n]+\n\s*sha256 ")[^"]+(")', rf'\g<1>{sha_arm}\g<2>', content, count=1)

          assert f'version "{v}"' in content, "Failed to update version in Formula/rgt.rb"
          assert sha_mac in content, "Failed to update macOS arm sha256 in Formula/rgt.rb"
          assert sha_intel in content, "Failed to update Linux intel sha256 in Formula/rgt.rb"
          assert sha_arm in content, "Failed to update Linux arm sha256 in Formula/rgt.rb"

          with open("Formula/rgt.rb", "w") as f:
              f.write(content)
          print(f"Successfully updated Formula/rgt.rb to version {v}")
          EOF

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rgt.rb
          git commit -m "chore: update Homebrew SHA256s for ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name || 'develop' }}
