name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: tar.gz
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.suffix == 'tar.gz'
        run: |
          if [ "${{ matrix.cross || '' }}" = "true" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/rgt
          else
            strip target/${{ matrix.target }}/release/rgt
          fi

      - name: Package archive (tar.gz)
        if: matrix.suffix == 'tar.gz'
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          cd target/${{ matrix.target }}/release
          tar -czf "../../../rgt-v${VERSION}-${{ matrix.target }}.tar.gz" rgt
          cd ../../..
          sha256sum "rgt-v${VERSION}-${{ matrix.target }}.tar.gz" > "rgt-v${VERSION}-${{ matrix.target }}.tar.gz.sha256"
        shell: bash

      - name: Package archive (zip)
        if: matrix.suffix == 'zip'
        run: |
          $tag = '${{ inputs.tag }}' -replace 'refs/tags/', ''
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rgt.exe" "dist/rgt.exe"
          Compress-Archive -Path dist/rgt.exe -DestinationPath "rgt-v${version}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "rgt-v${version}-${{ matrix.target }}.zip").Hash.ToLower()
          "$hash  rgt-v${version}-${{ matrix.target }}.zip" | Out-File -Encoding ascii "rgt-v${version}-${{ matrix.target }}.zip.sha256"
        shell: pwsh

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgt-${{ matrix.target }}
          path: |
            rgt-v*.${{ matrix.suffix }}
            rgt-v*.${{ matrix.suffix }}.sha256
          if-no-files-found: error

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binary
        run: cargo build --release

      - name: Build DEB
        run: cargo deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: rgt-deb
          path: target/debian/*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rgt-rpm
          path: target/generate-rpm/*.rpm

  release:
    name: Create GitHub Release
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}

  homebrew:
    name: Update Homebrew formula
    needs: release
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Dispatch Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: rafael-bianchi/homebrew-tap
          event-type: rgt-release
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "tag": "${{ steps.version.outputs.tag }}"
            }
