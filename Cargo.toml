[package]
name = "rgt"
version = "0.4.0"
edition = "2021"
authors = ["RGT Contributors"]
description = "Rust Graph Tracker: Numeric and date provenance tracking for LLM coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rafael-bianchi/rgt"
homepage = "https://github.com/rafael-bianchi/rgt"
documentation = "https://github.com/rafael-bianchi/rgt"
readme = "README.md"
keywords = ["graph", "cli", "dependency", "tracking", "provenance"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".specify/",
    "specs/",
    ".github/workflows/release.yml",
    ".gitignore",
]

[dependencies]
petgraph = "0.6"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
dirs = "5.0"
sha2 = "0.10"
ureq = "2.10"
flate2 = "1.0"
tar = "0.4"
zip = "2.2"
walkdir = "2.5"
tempfile = "3.10"
evalexpr = "13.1.0"

[dev-dependencies]

[[test]]
name = "test_invalidation"
path = "tests/unit/test_invalidation.rs"

[[test]]
name = "test_date_diff"
path = "tests/unit/test_date_diff.rs"

[[test]]
name = "test_hooks_contract"
path = "tests/contract/test_hooks_contract.rs"

[[test]]
name = "test_quickstart"
path = "tests/integration/test_quickstart.rs"

[[test]]
name = "test_installer_script"
path = "tests/integration/test_installer_script.rs"

[[test]]
name = "test_hooks_installer"
path = "tests/integration/test_hooks_installer.rs"

[[test]]
name = "test_update_contract"
path = "tests/contract/test_update_contract.rs"

[[test]]
name = "test_record"
path = "tests/unit/test_record.rs"

[[test]]
name = "test_hook_parsers"
path = "tests/unit/hook_parsers.rs"

[[test]]
name = "test_detection"
path = "tests/unit/detection.rs"

[[test]]
name = "test_paths"
path = "tests/unit/paths.rs"

[[test]]
name = "test_hook_installer_contract"
path = "tests/contract/hook_installer.rs"

[[test]]
name = "test_cli_record_derive"
path = "tests/contract/test_cli_record_derive_contract.rs"

[[test]]
name = "test_distribution_quickstart"
path = "tests/integration/test_distribution_quickstart.rs"

[[test]]
name = "test_distribution_performance"
path = "tests/integration/test_distribution_performance.rs"

[[bench]]
name = "bench_detection"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "RGT Contributors"
section = "utils"
assets = [
    ["target/release/rgt", "usr/bin/rgt", "755"],
]
depends = ""

[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
summary = "Rust Graph Tracker: Numeric and date provenance tracking for LLM coding agents"
assets = [
    { source = "target/release/rgt", dest = "/usr/bin/rgt", mode = "755" },
]
